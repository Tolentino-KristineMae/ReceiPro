# Render Config for ReciePro Backend (using external Supabase DB)
# Use this as reference, but deploy manually via Render Dashboard
# since we're using an existing Supabase database

services:
  - type: web
    name: reciepro-backend
    env: php
    plan: starter
    rootDir: backend
    buildCommand: |
      composer install --no-interaction --prefer-dist --optimize-autoloader
      npm install
      npm run build
      php artisan storage:link
    startCommand: php artisan serve --host 0.0.0.0 --port 10000

