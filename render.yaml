services:
  - type: web
    name: reciepro-backend
    env: php
    plan: starter
    buildCommand: |
      composer install --no-interaction --prefer-dist --optimize-autoloader
      npm install
      npm run build
      php artisan key:generate --force
      php artisan storage:link
    startCommand: php artisan serve --host 0.0.0.0 --port 10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: reciepro-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reciepro-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: reciepro-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: reciepro-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reciepro-db
          property: password
      - key: APP_KEY
        generateValue: true
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
databases:
  - name: reciepro-db
    databaseName: reciepro
    user: reciepro
    plan: starter
